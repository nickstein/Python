{% extends 'store/main.html' %}
{% load static %}
{% block content%}

<h2>Your Profile</h2>
<p>Username: {{ user.username }}</p>
<p>Email: {{ user.email }}</p>
<a href="{% url 'logout' %}">Logout</a>


<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Update</button>
</form>

{% endblock content %}
